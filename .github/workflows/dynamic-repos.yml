name: Update Dynamic Repositories

on:
  schedule:
    - cron: "0 0 * * *" # Roda todos os dias
  workflow_dispatch: # Permite rodar manualmente na aba Actions
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Update README.md
        run: python .github/scripts/update_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos repositórios detectada."
          else
            git commit -m "docs: atualiza os repositorios dinamicos"
            git push
          fi
